[package]
name = "ghost-message-tests"
version = "0.1.0"
edition = "2024"
publish = false
# The test files sit directly in this folder (no tests/tests/), so list them below.
autotests = false

# Own workspace = own Cargo.lock. LiteSVM's Solana/Agave versions never touch the program.
# cpi-recorder/ is an on-chain test program; it belongs to the root workspace.
[workspace]
exclude = ["cpi-recorder"]

[[test]]
name = "room"
path = "room.rs"

[[test]]
name = "session"
path = "session.rs"

[[test]]
name = "magicblock"
path = "magicblock.rs"

[dev-dependencies]
litesvm = "0.18.1"
# Not used directly. litesvm 0.18 is built against Agave 4.3 and does not compile against 4.4;
# Agave crates pin each other with `=`, so `~4.3` holds the whole family at 4.3.x.
solana-program-runtime = "~4.3"
# Same versions litesvm uses, so the types match `svm.send_transaction(...)`.
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-instruction = "3.5"
solana-address = { version = "~2.7", features = ["curve25519"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-clock = "~3.2"
solana-account = "4.3"
base64 = "0.22"
