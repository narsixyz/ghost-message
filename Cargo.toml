[workspace]
members = ["program", "tests/cpi-recorder"]
# tests/ is a separate workspace with its own Cargo.lock.
exclude = ["tests"]
resolver = "3"

[workspace.package]
edition = "2024"
# Must stay <= the platform-tools rustc (1.95.0-dev in v1.57/v1.58), never the host rustc.
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
